name: api-probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/api-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Versions
        run: |
          curl -s https://download.linphone.org/maven_repository/org/linphone/linphone-sdk-android/maven-metadata.xml
          ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools
      - name: Dump API
        run: |
          V=$(curl -s https://download.linphone.org/maven_repository/org/linphone/linphone-sdk-android/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+')
          echo "release=$V"
          curl -sL -o sdk.aar https://download.linphone.org/maven_repository/org/linphone/linphone-sdk-android/$V/linphone-sdk-android-$V.aar
          ls -la sdk.aar
          mkdir x && cd x && unzip -q ../sdk.aar && ls && ls jni || true
          unzip -l classes.jar | grep -c class
          mkdir c && cd c && unzip -q ../classes.jar
          for k in Factory Core Call CallParams Account AccountParams AuthInfo Address CoreListenerStub CoreListener CallListenerStub ChatRoom ChatMessage ChatRoomParams Friend FriendList PresenceModel PresenceActivity Event NatPolicy PayloadType Transports MediaEncryption RegistrationState GlobalState CallLog Content Conference ConferenceParams TransportType AudioDevice Reason ChatMessageListenerStub EventListenerStub ConsolidatedPresence Tunnel VideoActivationPolicy Config; do
            echo "===== $k"; javap -cp . org.linphone.core.$k 2>&1 | grep -v '^Compiled'
          done
          echo "===== enums"
          ls org/linphone/core | grep '\$' | head -200
          for k in 'Call$State' 'Call$Dir' 'Call$Status' 'ChatMessage$State' 'RegistrationState' 'MediaEncryption' 'TransportType' 'AudioDevice$Type' 'Reason' 'ConsolidatedPresence' 'MediaDirection' 'SubscriptionState' 'FirewallPolicy' 'LogLevel' 'ChatRoom$State' 'ChatRoom$Capabilities' 'Core$LogCollectionUploadState'; do echo "===== $k"; javap -cp . "org.linphone.core.$k" 2>&1 | grep -E 'public static final' ; done
          ls ../../x/c/org/linphone || true
