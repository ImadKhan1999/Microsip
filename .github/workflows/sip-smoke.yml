name: SIP smoke test (manual)

# Manually registers a SIP account against a real server with tools/sip_register_test.py.
# Uses the SIP_PASSWORD repository secret, or the "password" input when given (it is masked in logs,
# but run inputs are visible on the run page to people with access to this repository).
on:
  workflow_dispatch:
    inputs:
      user: { description: 'Username', default: '13811' }
      domain: { description: 'Domain', default: 'sip.sipup.org' }
      proxy: { description: 'Server / proxy host', default: '162.19.138.146' }
      password: { description: 'Password (leave empty to use the SIP_PASSWORD secret)', required: false, default: '' }

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Register (TLS, TCP, UDP)
        env:
          INPUT_PW: ${{ inputs.password }}
          SECRET_PW: ${{ secrets.SIP_PASSWORD }}
        run: |
          export SIP_PASSWORD="${INPUT_PW:-$SECRET_PW}"
          [ -n "$SIP_PASSWORD" ] && echo "::add-mask::$SIP_PASSWORD"
          [ -z "$SIP_PASSWORD" ] && { echo "No password given"; exit 1; }
          rc=0
          for t in tls tcp udp; do
            echo "::group::$t"
            python3 tools/sip_register_test.py --user "${{ inputs.user }}" --domain "${{ inputs.domain }}" --proxy "${{ inputs.proxy }}" --transport $t || { [ $t = tls ] && rc=1; }
            echo "::endgroup::"
          done
          exit $rc
